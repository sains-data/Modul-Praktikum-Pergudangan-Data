version: 2

models:
  - name: dim_produk
    description: >
      Dimensi produk SCD Type 2. Satu produk dapat memiliki beberapa baris,
      masing-masing berlaku pada rentang [mulai_berlaku, selesai_berlaku).
      Memuat baris unknown berkunci -1.
    columns:
      - name: produk_key
        description: Surrogate key. Berbeda untuk setiap versi produk.
        tests:
          - unique
          - not_null
      - name: produk_id
        description: >
          Natural key dari sistem sumber. SENGAJA tidak unik -- satu produk
          punya beberapa versi. Uji unique dipasang pada produk_key.
        tests:
          - not_null
      - name: kategori
        description: Kategori yang sudah distandardisasi lintas tiga sumber.

  - name: dim_audit
    description: >
      Audit dimension. Menghubungkan setiap baris fakta ke batch pemuatan yang
      menghasilkannya, sehingga pemuatan ulang dapat dibatasi pada batch yang
      bermasalah saja.
    columns:
      - name: audit_key
        tests:
          - unique
          - not_null
      - name: status_mutu
        description: Ringkasan kelengkapan batch.
        tests:
          - accepted_values:
              values: ['lengkap', 'ada selisih', 'gagal', 'tidak diketahui']

